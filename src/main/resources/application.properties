# Config
spring.application.name=SmarterFit
server.port=8081
spring.profiles.active=local

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.initialization-mode=always

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Otimizações do Hibernate
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Flyway Settings
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# May be necessary if migrating an existing database
spring.flyway.baseline-on-migrate=false

# Encryption keys
encryption.key=1234567812345678
encryption.algorithm=AES

# Jwt
jwt.key=33A2E29903EDAFD378980201A09B9B451C7E09226647F4E5C273B693E0766C38

# LLM
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# Redis
#spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

spring.config.import=classpath:framework.yaml

# Encoding
server.servlet.encoding.charset=UTF-8
spring.mandatory-file-encoding=UTF-8

# Configurações de ambiente
# Datasource connect
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Groq key
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}